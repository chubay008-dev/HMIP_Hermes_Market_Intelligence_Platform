[project]
name = "hmip"
version = "0.1.0"
description = "HMIP — Hermes Market Intelligence Platform (Enterprise AI Operating System, single-agent autonomous runtime)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "structlog>=24.1",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
# Sprint 6: platform* -> platform_* (renamed after a stdlib name
# collision broke pytest test collection — see
# ADR_010_platform_package_rename.md). Explicitly "platform_*", not a
# wildcard that would also match the old, now-orphaned `platform/`
# folder still on disk until it's manually deleted.
include = ["core*", "shared*", "platform_*", "domains*", "knowledge*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "domains"]
# 08_Testing_Standard.md section 4: unit coverage >= 80% (enforced
# here via --cov-fail-under). Critical-workflow coverage (>= 90%) is
# not separately automatable from this single config — the
# tests/workflow/ suite is reviewed manually against that bar instead
# of via a second coverage gate.
addopts = "--cov=core --cov=domains --cov=knowledge --cov=platform_ --cov=shared --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["core", "domains", "knowledge", "platform_", "shared"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
