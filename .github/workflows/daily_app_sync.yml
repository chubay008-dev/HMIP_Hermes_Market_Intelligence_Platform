name: Daily app sync (giá quét + PI)

# Chạy SAU reconcile (09:00 VN, cron "0 2 * * *") để cùng ngày dữ liệu:
# reconcile commit prices_real.json → Render auto-deploy (app restart ~2-5')
# → workflow này wake app rồi trigger 2 luồng thu thập:
#   - /api/run-all: giá quét 68 SP (bảng chính trang chủ /api/latest)
#   - /api/price-intelligence/collect-if-stale: PI charts workspace
# Cả 2 endpoint đều chạy nền async (trả 200 ngay), không chặn runner.
#
# Secrets cần có (GitHub repo Settings → Secrets → Actions):
#   HMIP_API_TOKEN — Bearer token app (giá trị = HMIP_API_TOKEN trên Render)
#
# Anti-spam/credit: collect-if-stale có stale-guard 5' + notify 5 lớp; chain
# 4-tier có circuit breaker khi Firecrawl hết credit → fail-safe, không vỡ run.

on:
  schedule:
    - cron: "30 2 * * *"   # 09:30 giờ Việt Nam (UTC+7), sau reconcile 09:00
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HMIP_BASE_URL: https://hmip.onrender.com
    steps:
      - name: Kiểm tra secret HMIP_API_TOKEN
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          if [ -z "$HMIP_API_TOKEN" ]; then
            echo "::error::Thiếu secret HMIP_API_TOKEN. Thêm tại Settings → Secrets → Actions (giá trị = HMIP_API_TOKEN trên Render Dashboard)."
            exit 1
          fi

      - name: Wake Render (free tier ngủ sau 15')
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 20 "$HMIP_BASE_URL/api/health" || true)
            echo "lần $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::App không sống sau 5 phút (Render đang deploy lại hoặc sập?)."
          exit 1

      - name: Trigger giá quét (/api/run-all → bảng trang chủ)
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          curl -sS -f -m 60 -X POST "$HMIP_BASE_URL/api/run-all" \
            -H "Authorization: Bearer $HMIP_API_TOKEN"
          echo

      - name: Trigger PI collect (/api/price-intelligence/collect-if-stale → workspace)
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          curl -sS -f -m 60 -X POST \
            "$HMIP_BASE_URL/api/price-intelligence/collect-if-stale" \
            -H "Authorization: Bearer $HMIP_API_TOKEN"
          echo
