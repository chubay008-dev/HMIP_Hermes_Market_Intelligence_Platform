name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "fastapi" "uvicorn[standard]" "apscheduler" "httpx" "requests"

      - name: Lint (ruff) — kernel + tests
        # Kernel (core/domains/knowledge/platform_/shared) + tests đã sạch ruff.
        # extensions/ là lớp web đang phát triển, nhiều vi phạm còn tồn đọng —
        # chưa đưa vào gate để không chặn CI; xử lý dần riêng.
        run: ruff check core domains knowledge platform_ shared tests

      - name: Type-check kernel (mypy strict)
        # mypy strict chỉ áp cho kernel (core/domains/knowledge/platform_/shared),
        # đã sạch. extensions/ là lớp web, nhiều hàm chưa có annotation —
        # chạy riêng, không chặn CI hiện tại.
        run: mypy core domains knowledge platform_ shared

      - name: Test (pytest + coverage gate 80%)
        run: pytest
