name: Reconcile giá đa nguồn + Daily Report

# Bốn lịch trong cùng file, định tuyến job bằng github.event.schedule:
#   03:30 VN — job reconcile (giá thật → prices_real.json → Render auto-deploy)
#   04:00 VN — job app-sync (giá quét trang chủ + PI collect BLOCKING — xong thật)
#   ≈05:00 VN — job report (needs: app-sync → gọi /daily-report/send → TG+Discord+Email)
#   04:45 / 07:45 / 10:45 VN — job healthcheck (dead man's switch: phát hiện run
#     theo lịch bị miss do sự cố GitHub Actions → cảnh báo TG/Discord + mở session
#     OpenHands + tự dispatch chạy bù khi Actions hồi phục). Lặp 3 lần/ngày để bắt
#     kịp ngay khi GitHub hồi phục trong ngày (vụ 26-27/08/2026).
# workflow_dispatch chạy cả ba (app-sync chỉ chạy nếu reconcile thành công).

on:
  schedule:
    - cron: "30 20 * * *"  # 03:30 VN (UTC+7) — chạy sau beer-price-scan (03:00)
    - cron: "0 21 * * *"   # 04:00 VN (UTC+7) — app sync sau reconcile 30'
    - cron: "45 21 * * *"  # 04:45 VN — healthcheck lượt 1 (sau app-sync 45')
    - cron: "45 0 * * *"   # 07:45 VN — healthcheck lượt 2
    - cron: "45 3 * * *"   # 10:45 VN — healthcheck lượt 3
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # auto_remediate đọc log run; healthcheck dispatch chạy bù
  pull-requests: write  # agent mở/merge PR auto-remediate có điều kiện
  checks: read          # agent đọc trạng thái CI check của PR

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 20 * * *'
    runs-on: ubuntu-latest
    outputs:
      # SHA commit vừa push (rỗng nếu không có thay đổi) — app-sync chờ Render
      # deploy đúng commit này trước khi gọi collect, tránh race 502 (28/08).
      pushed_sha: ${{ steps.commit.outputs.pushed_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hướng A+B+C: thu thập raw từ các adapter (websosanh, sendo, apify/shopee).
      # Adapter nào lỗi không chặn adapter khác; thiếu APIFY_TOKEN thì shopee SKIP.
      - name: Collect raw sources (A/B/C)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/collect_sources.py

      # Hòa giải: raw + beer_scan + channels -> knowledge/master/prices_real.json
      - name: Reconcile prices
        run: python3 scripts/reconcile_prices.py

      - name: Commit master update
        id: commit
        run: |
          git config user.name "hmip-reconcile[bot]"
          git config user.email "hmip-reconcile[bot]@users.noreply.github.com"
          git add knowledge/master/prices_real.json knowledge/dynamic/last_reconcile.json
          if git commit -m "data: reconcile giá $(date -u +%Y-%m-%d) từ đa nguồn"; then
            git push
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "không có thay đổi master"
            echo "pushed_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Báo kết quả reconcile
        run: |
          echo "### Reconcile $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          cat knowledge/dynamic/last_reconcile.json >> $GITHUB_STEP_SUMMARY

      - name: Auto-remediation (mở session OpenHands khi fail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          JOB_LABEL: "HMIP reconcile"
          TELEGRAM_DONE_BOT_TOKEN: ${{ secrets.TELEGRAM_DONE_BOT_TOKEN }}
          TELEGRAM_DONE_CHAT_ID: ${{ secrets.TELEGRAM_DONE_CHAT_ID }}
          DISCORD_DONE_BOT_TOKEN: ${{ secrets.DISCORD_DONE_BOT_TOKEN }}
          DISCORD_DONE_CHANNEL_ID: ${{ secrets.DISCORD_DONE_CHANNEL_ID }}
        run: python3 scripts/auto_remediate.py
      - name: Thông báo hoàn tất (Telegram + Discord)
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          DONE_TASK_DESC: "Thu thập đa nguồn → reconcile → commit prices_real.json"
          TELEGRAM_DONE_BOT_TOKEN: ${{ secrets.TELEGRAM_DONE_BOT_TOKEN }}
          TELEGRAM_DONE_CHAT_ID: ${{ secrets.TELEGRAM_DONE_CHAT_ID }}
          DISCORD_DONE_BOT_TOKEN: ${{ secrets.DISCORD_DONE_BOT_TOKEN }}
          DISCORD_DONE_CHANNEL_ID: ${{ secrets.DISCORD_DONE_CHANNEL_ID }}
        run: python3 scripts/notify_done.py

  # ---- daily app sync (giá quét trang chủ + PI collect) --------------------
  # Chạy 04:00 VN (cron riêng) hoặc theo sau reconcile khi dispatch tay.
  # Trigger 2 endpoint trên Render (trả 200, không chặn runner):
  #   - POST /api/scan-if-stale → bảng giá quét trang chủ (/api/latest)
  #   - POST /api/price-intelligence/collect (BLOCKING — chờ PI xong) → workspace
  # Secret cần: HMIP_API_TOKEN (= giá trị HMIP_API_TOKEN trên Render Dashboard).
  app-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # wake 5' + chờ deploy 15' + collect blocking 30' + dư
    needs: reconcile
    if: >
      always() && (
        github.event.schedule == '0 21 * * *'
        || (github.event_name == 'workflow_dispatch' && needs.reconcile.result == 'success')
      )
    env:
      HMIP_BASE_URL: https://hmip.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret HMIP_API_TOKEN
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          if [ -z "$HMIP_API_TOKEN" ]; then
            echo "::error::Thiếu secret HMIP_API_TOKEN. Thêm tại Settings → Secrets → Actions (giá trị = HMIP_API_TOKEN trên Render Dashboard)."
            exit 1
          fi

      - name: Wake Render (free tier ngủ sau 15')
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 20 "$HMIP_BASE_URL/api/health" || true)
            echo "lần $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::App không sống sau 5 phút (Render đang deploy lại hoặc sập?)."
          exit 1

      # Race 28/08: reconcile push commit → Render auto-deploy NGAY → health 200
      # trả từ instance CŨ, rồi Render swap instance giữa chừng → collect 502 sau
      # ~95s. Chờ tới khi app đang chạy ĐÚNG commit vừa push (health.commit).
      - name: Chờ Render deploy đúng commit vừa reconcile (chống race 502)
        if: needs.reconcile.outputs.pushed_sha != ''
        run: |
          want="${{ needs.reconcile.outputs.pushed_sha }}"
          echo "Chờ health.commit == $want"
          last=""
          for i in $(seq 1 45); do
            last=$(curl -sS -m 20 "$HMIP_BASE_URL/api/health" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" \
              2>/dev/null || true)
            echo "lần $i: health.commit=$last"
            if [ "$last" = "$want" ]; then echo "Deploy đúng commit — tiếp tục."; exit 0; fi
            sleep 20
          done
          if [ -z "$last" ]; then
            # App không trả commit (bản cũ chưa có field / thiếu RENDER_GIT_COMMIT)
            # → không verify được; đã chờ 15' nên deploy nhiều khả năng đã xong.
            echo "::warning::Không verify được commit deploy (app không trả health.commit) — tiếp tục sau 15' chờ."
            exit 0
          fi
          echo "::error::Render chưa deploy commit $want sau 15 phút (đang chạy $last) — deploy kẹt?"
          exit 1

      # /api/run-all quét đồng bộ ~68 SP → vượt 60s dễ timeout (exit 28).
      # Dùng /api/scan-if-stale (async nền, trả ngay) thay vì run-all đồng bộ;
      # stale-guard 5' sẵn có. Vẫn accept 200/202; fail mềm (|| true) khi
      # endpoint timeout nhưng vẫn cho step PI chạy tiếp.
      - name: Trigger giá quét (/api/scan-if-stale → bảng trang chủ)
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          resp=$(curl -sS -m 30 -X POST "$HMIP_BASE_URL/api/scan-if-stale" \
            -H "Authorization: Bearer $HMIP_API_TOKEN" || true)
          echo "$resp"

      - name: Trigger PI collect (blocking /api/price-intelligence/collect → workspace)
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          # Endpoint blocking (mới, PR #21): đến khi PI collect xong hoàn toàn —
          # report job phía sau đọc dữ liệu mới nhất. -f: fail đỏ khi 401/5xx.
          # Collect duyệt 68 SP × 5 kênh × tier chain (mỗi call sleep 0.6s, HTTP
          # tới 60s) → thường 10-25'. -m 300 cũ quá ngắn (run 32782202819 timeout
          # đúng 300s); nâng 1800s (30'), vẫn trong budget job timeout-minutes: 45.
          # KHÔNG thêm --retry: server vẫn chạy collect tiếp sau khi client ngắt,
          # retry sẽ kích hoạt collect thứ hai chạy song song.
          resp=$(curl -sSf -m 1800 -X POST \
            "$HMIP_BASE_URL/api/price-intelligence/collect?limit=200" \
            -H "Authorization: Bearer $HMIP_API_TOKEN")
          echo "$resp"

      - name: Auto-remediation (mở session OpenHands khi fail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          JOB_LABEL: "HMIP app-sync"
          TELEGRAM_DONE_BOT_TOKEN: ${{ secrets.TELEGRAM_DONE_BOT_TOKEN }}
          TELEGRAM_DONE_CHAT_ID: ${{ secrets.TELEGRAM_DONE_CHAT_ID }}
          DISCORD_DONE_BOT_TOKEN: ${{ secrets.DISCORD_DONE_BOT_TOKEN }}
          DISCORD_DONE_CHANNEL_ID: ${{ secrets.DISCORD_DONE_CHANNEL_ID }}
        run: python3 scripts/auto_remediate.py
      - name: Thông báo hoàn tất (Telegram + Discord)
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          DONE_TASK_DESC: "Wake Render → trigger quét giá trang chủ + PI collect"
          TELEGRAM_DONE_BOT_TOKEN: ${{ secrets.TELEGRAM_DONE_BOT_TOKEN }}
          TELEGRAM_DONE_CHAT_ID: ${{ secrets.TELEGRAM_DONE_CHAT_ID }}
          DISCORD_DONE_BOT_TOKEN: ${{ secrets.DISCORD_DONE_BOT_TOKEN }}
          DISCORD_DONE_CHANNEL_ID: ${{ secrets.DISCORD_DONE_CHANNEL_ID }}
        run: python3 scripts/notify_done.py

  # ---- daily report (SAU app-sync + reconcile — đọc dữ liệu đã nạp) ---------
  # Trigger khi app-sync xong (cùng cron 0 21) → dữ liệu mới nhất.
  # Cùng gọi /daily-report/send trên Render (API 1 chỗ) → không chồng chéo.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: app-sync
    if: >
      always() && (
        needs.app-sync.result == 'success'
        && (
          github.event.schedule == '0 21 * * *'
          || github.event_name == 'workflow_dispatch'
        )
      )
    env:
      HMIP_BASE_URL: https://hmip.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret HMIP_API_TOKEN
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          if [ -z "$HMIP_API_TOKEN" ]; then
            echo "::error::Thiếu secret HMIP_API_TOKEN."
            exit 1
          fi

      - name: Wake Render trước khi report
        run: |
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 20 "$HMIP_BASE_URL/api/health" || true)
            echo "lần $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Render không sống."
          exit 1

      - name: Gửi Daily Report qua Render (TG/Discord/email + topics track)
        env:
          HMIP_API_TOKEN: ${{ secrets.HMIP_API_TOKEN }}
        run: |
          resp=$(curl -sSf -m 120 -X POST \
            "$HMIP_BASE_URL/api/price-intelligence/daily-report/send" \
            -H "Authorization: Bearer $HMIP_API_TOKEN")
          echo "$resp"

      - name: Thông báo hoàn tất (Telegram + Discord)
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          DONE_TASK_DESC: "Daily FMCG Intelligence Report — sau app-sync (dữ liệu mới nhất)"
          TELEGRAM_DONE_BOT_TOKEN: ${{ secrets.TELEGRAM_DONE_BOT_TOKEN }}
          TELEGRAM_DONE_CHAT_ID: ${{ secrets.TELEGRAM_DONE_CHAT_ID }}
          DISCORD_DONE_BOT_TOKEN: ${{ secrets.DISCORD_DONE_BOT_TOKEN }}
          DISCORD_DONE_CHANNEL_ID: ${{ secrets.DISCORD_DONE_CHANNEL_ID }}
        run: python3 scripts/notify_done.py

  # ---- pipeline healthcheck (dead man's switch) -------------------------------
  # Chạy sau giờ pipeline (3 cron "45 *"): kiểm tra run theo lịch hôm nay có tồn
  # tại không. Thiếu → hỏi GitHub Status API; nếu Actions đang sự cố thì cảnh báo
  # TG/Discord + mở session OpenHands theo dõi, nếu Actions đã hồi thì tự dispatch
  # chạy bù. Chỉ schedule (workflow_dispatch không chạy job này để tránh nhiễu).
  healthcheck:
    if: github.event_name == 'schedule' && startsWith(github.event.schedule, '45 ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Healthcheck dead man's switch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_FILE: reconcile.yml
          REPO_LABEL: HMIP reconcile (app-sync + report)
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          TELEGRAM_DONE_BOT_TOKEN: ${{ secrets.TELEGRAM_DONE_BOT_TOKEN }}
          TELEGRAM_DONE_CHAT_ID: ${{ secrets.TELEGRAM_DONE_CHAT_ID }}
          DISCORD_DONE_BOT_TOKEN: ${{ secrets.DISCORD_DONE_BOT_TOKEN }}
          DISCORD_DONE_CHANNEL_ID: ${{ secrets.DISCORD_DONE_CHANNEL_ID }}
        run: python3 scripts/pipeline_healthcheck.py

