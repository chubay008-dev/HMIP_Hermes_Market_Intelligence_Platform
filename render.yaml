# render.yaml — Deploy HMIP lên Render (free/paid)
# Cách dùng:
#   1. Push repo lên GitHub
#   2. Render Dashboard → New → Blueprint → chọn repo → dùng file này
#   HOẶC: New → Web Service → kết nối repo → Runtime: Docker → để trống (tự dùng Dockerfile)
#
# Lưu ý:
#   - free tier Render tự ngủ sau 15p không truy cập (spin-up ~30s).
#   - Không mount disk (free tier web service chạy ephemeral FS; data reset khi restart).
#     Muốn lưu lịch sử giá bền vực → nâng gói paid hoặc dùng Postgres external.

services:
  - type: web
    name: hmip
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render cấp port qua biến $PORT; start.sh đã đọc $PORT.
    healthCheckPath: /api/health
    envVars:
      - key: HMIP_IN_DOCKER
        value: "1"
      - key: HMIP_AUTOSCAN
        value: "on"            # bật quét tự động nền (APScheduler)
      - key: HMIP_SCAN_INTERVAL_MIN
        value: "30"            # quét mỗi 30 phút (free tier tránh quá tải)
      - key: HMIP_COLLECT_MODE
        value: "http"          # dùng nguồn giá thật (chain 4-tier: Firecrawl→ScraperAPI→ZenRows→Jina)
      - key: HMIP_API_TOKEN
        generateValue: true    # Render tự sinh 1 chuỗi ngẫu nhiên (dùng login web)
      - key: HMIP_PI_DB_PATH
        value: "/app/data/hmip_pi.db"   # Price Intelligence DB (trong volume; free tier ephemeral → marker giữ giá thật cố định)
      - key: HMIP_PI_COLLECT_MIN
        value: "360"                    # quét gia tăng mỗi 6h (chỉ ghi khi giá đổi + notify; tiết kiệm credit)
      - key: TELEGRAM_HMIP_MARKET_BOT
        sync: false                     # 🔒 SECRET — token bot HMIP Market (Discord/Telegram alert). Điền tại Render Dashboard.
      - key: TELEGRAM_CHAT_ID
        value: "8891619372"             # chat_id nhận alert Telegram (user id)
      - key: CRAWL4AI_ENABLED
        value: "false"                    # tier 4 (cần chromium, nặng) - bật true nếu muốn self-host crawl
      - key: FIRECRAWL_API_KEY
        sync: false                    # 🔒 SECRET — Tier 1: cào giá Tiki qua Firecrawl (đáng tin nhất). Điền key tại Render Dashboard.
      - key: SCRAPERAPI_KEY
        sync: false                    # 🔒 SECRET — Tier 2: ScraperAPI render JS (free 5000/tháng). Fallback khi Firecrawl hết credit.
      - key: ZENROWS_KEY
        sync: false                    # 🔒 SECRET — Tier 3: ZenRows render JS (free 1000/tháng). Fallback tier 2.
      - key: DISCORD_BOT_TOKEN
        sync: false                     # 🔒 SECRET — Discord bot token đẩy alert
      - key: DISCORD_HOME_CHANNEL
        sync: false                     # Discord channel ID nhận alert (để trống nếu dùng DM)
      - key: DISCORD_DM_USER_ID
        value: "1519733836819202078"   # Discord user ID nhận alert qua DM (bot tự tạo DM channel)
