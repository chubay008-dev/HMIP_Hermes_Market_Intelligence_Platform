# render.yaml — Deploy HMIP lên Render (free/paid)
# Cách dùng:
#   1. Push repo lên GitHub
#   2. Render Dashboard → New → Blueprint → chọn repo → dùng file này
#   HOẶC: New → Web Service → kết nối repo → Runtime: Docker → để trống (tự dùng Dockerfile)
#
# Lưu ý:
#   - free tier Render tự ngủ sau 15p không truy cập (spin-up ~30s).
#   - Không mount disk (free tier web service chạy ephemeral FS; data reset khi restart).
#     Muốn lưu lịch sử giá bền vực → nâng gói paid hoặc dùng Postgres external.

services:
  - type: web
    name: hmip
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render cấp port qua biến $PORT; start.sh đã đọc $PORT.
    healthCheckPath: /api/health
    envVars:
      - key: HMIP_IN_DOCKER
        value: "1"
      - key: HMIP_AUTOSCAN
        value: "on"            # bật quét tự động nền (APScheduler)
      - key: HMIP_SCAN_INTERVAL_MIN
        value: "30"            # quét mỗi 30 phút (free tier tránh quá tải)
      - key: HMIP_COLLECT_MODE
        value: "demo"          # đổi thành "http" nếu có nguồn giá thật
      - key: HMIP_API_TOKEN
        generateValue: true    # Render tự sinh 1 chuỗi ngẫu nhiên (dùng login web)
      - key: HMIP_PI_DB_PATH
        value: "/app/data/hmip_pi.db"   # Price Intelligence DB (trong volume; free tier ephemeral → auto-seed lại)
      - key: HMIP_PI_COLLECT_MIN
        value: "360"                    # quét Firecrawl mỗi 6h (tiết kiệm credit; 402 nếu quét quá nhiều)
      - key: TELEGRAM_HMIP_MARKET_BOT
        sync: false                     # bạn điền token bot HMIP (Discord/Telegram alert)
      - key: FIRECRAWL_API_KEY
        value: "fc-906d2952a729471c99a642d5955d76a8"   # nguồn giá thật chính (Tiki qua Firecrawl)
      - key: DISCORD_BOT_TOKEN
        sync: false                     # Discord bot token đẩy alert
      - key: DISCORD_HOME_CHANNEL
        sync: false                     # Discord channel ID nhận alert
