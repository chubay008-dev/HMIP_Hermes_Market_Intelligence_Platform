# render.yaml — Deploy HMIP lên Render (free/paid)
# Cách dùng:
#   1. Push repo lên GitHub
#   2. Render Dashboard → New → Blueprint → chọn repo → dùng file này
#   HOẶC: New → Web Service → kết nối repo → Runtime: Docker → để trống (tự dùng Dockerfile)
#
# Lưu ý: free tier Render tự ngủ sau 15p không truy cập (spin-up ~30s).
# Nếu muốn luôn thức, dùng gói paid ($7/tháng) hoặc bật "Health Check".

services:
  - type: web
    name: hmip
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render cấp port qua biến $PORT; start.sh đã đọc $PORT.
    healthCheckPath: /api/health
    envVars:
      - key: HMIP_IN_DOCKER
        value: "1"
      - key: HMIP_AUTOSCAN
        value: "on"            # bật quét tự động nền (APScheduler)
      - key: HMIP_SCAN_INTERVAL_MIN
        value: "30"            # quét mỗi 30 phút (free tier tránh quá tải)
      - key: HMIP_COLLECT_MODE
        value: "demo"          # đổi thành "http" nếu có nguồn giá thật
      - key: HMIP_API_TOKEN
        sync: false            # NHẬP TOKEN TỪ RENDER DASHBOARD (bảo mật)
        generateValue: true    # Render tự sinh 1 chuỗi ngẫu nhiên
    # Ổ đĩa bền vực để hmip.db (lịch sử giá) không bị mất khi container restart.
    # Render Disk mount dùng key "mounts" (không phải "disks").
    mounts:
      - name: hmip-data
        path: /app/data
        sizeGB: 1
